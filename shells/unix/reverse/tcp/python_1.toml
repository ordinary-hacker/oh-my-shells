	"/usr/bin/env pdksh", "pdksh", "/bin/pdksh", "/usr/bin/pdksh", "/usr/local/bin/pdksh", "/opt/homebrew/bin/pdksh", "/opt/local/bin/pdksh", "/snap/bin/pdksh", "/usr/sbin/pdksh", "/sbin/pdksh", "env pdksh",
