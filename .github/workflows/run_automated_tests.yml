name: Run Automated Tests

on:
  push:
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "tests/**"
  pull_request:
    paths:
      - "src/**"
      - "include/**"
      - "lib/**"
      - "tests/**"

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Build CLI
      run: make

    - name: Run all tests
      run: make test
